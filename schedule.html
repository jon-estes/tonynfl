<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Print Sheets — Vince and Dave's Pool</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div id="sample-banner"></div>

  <div class="card">
    <h2>Weekly Print Sheets</h2>
    <p>Pick a week below to see the full matchup sheet — print it out or fill it in on screen, then submit your numbers on the Google Form.</p>
  </div>

  <div class="week-grid" id="week-grid"></div>
</main>

<footer>Powered by a Google Sheet, not a database</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="teams.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
(async function () {
  renderHeader("schedule");
  const state = await loadPoolData();
  renderSampleBanner(state);

  const weeks = getWeeks(state.schedule);
  const mount = document.getElementById("week-grid");

  if (!weeks.length) {
    mount.innerHTML = `<div class="empty-state">No schedule loaded yet.</div>`;
    return;
  }

  mount.innerHTML = weeks.map(w => {
    const games = state.schedule.filter(g => g.week === w);
    const firstKickoff = games[0] ? games[0].kickoff : "";
    return `
      <a class="week-card" href="week.html?week=${w}">
        <div class="week-card-num">Week ${w}</div>
        <div class="week-card-meta">${games.length} game${games.length === 1 ? "" : "s"}${firstKickoff ? " · starts " + firstKickoff : ""}</div>
        <div class="go">Print Sheet <span class="arrow">→</span></div>
      </a>
    `;
  }).join("");
})();
</script>
</body>
</html>
