<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vince's Pool</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero-photo">
  <div class="hero-photo-frame">
    <img src="assets/hero-stadium.jpg" alt="Vince's Pool — The Ultimate Football Challenge">
  </div>
</section>

<main>
  <div class="pool-cards">
    <a class="pool-card card-pickem" href="pickem.html">
      <div class="pool-card-glow"></div>
      <div class="icon-ring"><div class="icon">📋</div></div>
      <h2>Pick'em</h2>
      <p>Call every game, every week. Stack confidence points on your best bets. Most points wins the season.</p>
      <div class="go">Enter the Pool <span class="arrow">→</span></div>
    </a>
    <a class="pool-card card-eliminator" href="eliminator.html">
      <div class="pool-card-glow"></div>
      <div class="icon-ring"><div class="icon">☠️</div></div>
      <h2>Eliminator</h2>
      <p>One team a week. One loss and you're done. Burn a team once and it's gone for the season.</p>
      <div class="go">Enter the Pool <span class="arrow">→</span></div>
    </a>
  </div>
</main>

<footer>Powered by a Google Sheet, not a database</footer>
</body>
</html>
